# Dependency Review
# https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review
#
# Fails on pull requests that introduce dependencies with known vulnerabilities.
# Runs only on pull requests targeting the main branch.

name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # License denial policy: not configured.
          # A deny-licenses rule was removed because no formal licensing policy
          # has been documented for this repository. Add a deny-licenses entry
          # here once the Bridge Builders Collective licensing governance is
          # defined and documented in docs/DEPLOYMENT_CONFIGURATION_INVENTORY.md
          # or a dedicated licensing policy document.
