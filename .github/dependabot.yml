# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Ecosystems configured for this repository:
#   - github-actions: monitors workflow action versions
#   - npm: pre-configured for when a Node.js package.json is added
#
# npm is included because the repository references Node.js tooling and a
# frontend layer is planned. Remove or adjust the directory if the package
# location changes when development begins.

version: 2

updates:
  # GitHub Actions — monitors action pinning in workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # npm — pre-configured for the planned frontend package
  # Adjust `directory` to match the actual package location when added.
  # Major updates are separated to allow deliberate review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major version bumps reviewed manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
