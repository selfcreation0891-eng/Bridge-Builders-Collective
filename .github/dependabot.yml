# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Ecosystems configured for this repository:
#   - github-actions: monitors workflow action versions
#
# npm Dependabot is intentionally omitted because no package.json exists in this
# repository. Add an npm entry here when an npm project is introduced, pointing
# to the correct package directory.

version: 2

updates:
  # GitHub Actions — monitors action pinning in workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
